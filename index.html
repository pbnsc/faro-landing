<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Faro — money, finally clear</title>
<meta name="description" content="Faro brings all your bank account data into one calm, clear picture you can talk to. Join the waitlist." />
<meta property="og:title" content="Faro — money, finally clear" />
<meta property="og:description" content="A financial companion. One clear picture of your money, and an assistant you can talk to." />
<meta property="og:type" content="website" />
<style>
  :root{
    --bg:#0c0b09; --bg2:#131210; --hair:#242119; --hair2:#332e24;
    --ink:#f4efe6; --ink-2:#9f988c; --ink-3:#6b645a;
    --good:#5cba8c; --warn:#d7a24e;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);letter-spacing:-0.015em;
    -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
  .num{font-variant-numeric:tabular-nums}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}

  nav{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;height:74px}
  .brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;letter-spacing:-0.02em}
  .nav-cta{font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);background:none;
    border:1px solid var(--hair2);padding:8px 15px;border-radius:20px;transition:.25s;cursor:pointer}
  .nav-cta:hover{color:var(--ink);border-color:var(--ink-3)}

  .hero{position:relative;z-index:1;min-height:calc(100dvh - 74px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding-bottom:56px}
  .orb-hero{width:230px;height:230px;position:relative;display:flex;align-items:center;justify-content:center}
  .orb-glow{position:absolute;inset:-44%;background:radial-gradient(closest-side,rgba(215,162,78,.16),rgba(92,186,140,.055) 55%,transparent 74%);
    pointer-events:none}
  .hero h1{font-size:clamp(40px,6vw,66px);font-weight:600;letter-spacing:-0.04em;line-height:1;margin-top:34px}
  .hero p.sub{font-size:clamp(14px,1.4vw,15px);color:var(--ink-2);margin-top:22px;max-width:37ch;line-height:1.6}
  form{margin-top:34px;display:flex;gap:8px;width:100%;max-width:380px}
  form input{flex:1;background:var(--bg2);border:1px solid var(--hair2);border-radius:12px;
    padding:14px 16px;color:var(--ink);font-size:14px;font-family:inherit;outline:none;transition:.2s;text-align:center}
  form input::placeholder{color:var(--ink-3)}
  form input:focus{border-color:var(--good);text-align:left}
  form button{background:var(--good);color:#08140d;border:0;border-radius:12px;padding:14px 20px;
    font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
  form button:active{transform:translateY(1px)}
  form button:disabled{opacity:.6;cursor:default}
  .done{margin-top:34px;font-size:15px;color:var(--good);font-weight:500;display:none}
  .done.show{display:block}
  .err{margin-top:14px;font-size:13px;color:#e0736b;display:none}
  .err.show{display:block}
  .micro{margin-top:16px;font-size:12px;color:var(--ink-3)}

  footer{position:relative;z-index:1;border-top:1px solid var(--hair);padding:24px 0;
    display:flex;justify-content:space-between;align-items:center;color:var(--ink-3);font-size:12px}
  .euf{display:inline-flex;align-items:center;gap:7px}
  .euf svg{border-radius:2px;display:block}

  @media (max-width:640px){ form{max-width:100%} }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand"><canvas class="orb" width="60" height="60" style="width:20px;height:20px" aria-hidden="true"></canvas>Faro</div>
    <button type="button" class="nav-cta" onclick="joinFocus()">Join the waitlist</button>
  </nav>

  <section class="hero">
    <div class="orb-hero"><div class="orb-glow"></div><canvas id="orbHero" width="460" height="460" style="width:230px;height:230px" aria-hidden="true"></canvas></div>
    <h1>Your money, finally clear.</h1>
    <p class="sub">Faro brings all your bank account data into one calm, clear picture you can talk to.</p>
    <form id="f1" novalidate>
      <input type="email" placeholder="you@email.com" aria-label="Email" required autocomplete="email" />
      <button type="submit">Join the waitlist</button>
    </form>
    <div class="done" id="done" role="status" aria-live="polite">You are on the list. We will be in touch soon.</div>
    <div class="err" id="err" role="status" aria-live="polite">Something went wrong. Please try again.</div>
    <div class="micro">Private by design. Your data stays yours.</div>
  </section>

  <footer>
    <div class="brand" style="font-size:13px"><canvas class="orb" width="48" height="48" style="width:16px;height:16px" aria-hidden="true"></canvas>Faro</div>
    <div class="euf">Built in Europe <span id="eu"></span></div>
  </footer>
</div>

<script>
  var SUPABASE_URL="https://vpqjhowrmrdqvhaskdhw.supabase.co";
  var SUPABASE_KEY="sb_publishable_XiW_6HJkLJ2vFokWIn4R_Q_5XG9v2N5"; // publishable key; insert-only via RLS
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function col(t,alpha){
    var c1=[255,224,168], c2=[214,161,79], c3=[92,186,140], r,g,b,k;
    if(t<0.5){k=t/0.5;r=c1[0]+(c2[0]-c1[0])*k;g=c1[1]+(c2[1]-c1[1])*k;b=c1[2]+(c2[2]-c1[2])*k;}
    else{k=(t-0.5)/0.5;r=c2[0]+(c3[0]-c2[0])*k;g=c2[1]+(c3[1]-c2[1])*k;b=c2[2]+(c3[2]-c2[2])*k;}
    return "rgba("+(r|0)+","+(g|0)+","+(b|0)+","+alpha+")";
  }
  function makeOrb(canvas,cfg){
    cfg=cfg||{};
    var ctx=canvas.getContext("2d"), W=canvas.width, H=canvas.height, cx=W/2, cy=H/2;
    var maxR=Math.min(W,H)*(cfg.maxRf||0.42);
    var rings=cfg.rings||[{r:0,n:1},{r:0.34,n:8},{r:0.58,n:15},{r:0.8,n:22},{r:1.0,n:30}];
    var dotBase=cfg.dot|| (W*0.0052), dots=[];
    rings.forEach(function(ring,ri){
      for(var i=0;i<ring.n;i++){
        var a=(i/ring.n)*Math.PI*2 + ri*0.45;
        dots.push({ring:ri,r:ring.r*maxR,a:a,phase:Math.random()*Math.PI*2,spin:(ri%2?1:-1)*(0.05+ri*0.013)});
      }
    });
    var nrings=rings.length-1;
    function frame(now){
      var t=now*0.001; ctx.clearRect(0,0,W,H);
      dots.forEach(function(d){
        var breathe=1+0.045*Math.sin(t*1.25+d.phase);
        var ang=d.a+t*d.spin, rr=d.r*breathe;
        var x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr*0.97;
        var tt=nrings?d.ring/nrings:0;
        var al=0.55+0.35*Math.sin(t*1.5+d.phase);
        var size=(d.ring===0?dotBase*1.6:dotBase)*(0.85+0.28*Math.sin(t+d.phase));
        ctx.beginPath();ctx.arc(x,y,Math.max(0.7,size),0,Math.PI*2);
        ctx.fillStyle=col(tt,Math.max(0.16,al));ctx.fill();
      });
      if(!reduce) requestAnimationFrame(frame);
    }
    if(reduce) frame(0); else requestAnimationFrame(frame);
  }
  makeOrb(document.getElementById("orbHero"));
  document.querySelectorAll(".orb").forEach(function(c){
    makeOrb(c,{maxRf:0.44,dot:c.width*0.045,rings:[{r:0,n:1},{r:0.5,n:8},{r:0.85,n:13}]});
  });

  (function(){
    var svgns="http://www.w3.org/2000/svg";
    var svg=document.createElementNS(svgns,"svg");
    svg.setAttribute("width",24);svg.setAttribute("height",16);svg.setAttribute("viewBox","0 0 24 16");
    var rect=document.createElementNS(svgns,"rect");
    rect.setAttribute("width",24);rect.setAttribute("height",16);rect.setAttribute("rx",2);rect.setAttribute("fill","#003399");
    svg.appendChild(rect);
    function star(cx,cy,out){var inr=out*0.42,p="";
      for(var i=0;i<10;i++){var r=(i%2?inr:out),a=-Math.PI/2+i*Math.PI/5;
        p+=(i?"L":"M")+(cx+Math.cos(a)*r).toFixed(2)+" "+(cy+Math.sin(a)*r).toFixed(2)+" ";}
      return p+"Z";}
    for(var s=0;s<12;s++){var a=-Math.PI/2+s*Math.PI/6;
      var pt=document.createElementNS(svgns,"path");
      pt.setAttribute("d",star(12+Math.cos(a)*4.4,8+Math.sin(a)*4.4,1.15));
      pt.setAttribute("fill","#FFCC00");svg.appendChild(pt);}
    document.getElementById("eu").appendChild(svg);
  })();

  // waitlist submit -> Supabase (insert-only)
  var f=document.getElementById("f1"), done=document.getElementById("done"), err=document.getElementById("err");
  function showErr(msg){ err.textContent=msg; err.classList.add("show"); }
  function joinFocus(){
    if(f.style.display==="none"){ done.scrollIntoView({behavior:"smooth",block:"center"}); }
    else { f.querySelector("input").focus(); }
  }
  window.joinFocus=joinFocus;

  f.addEventListener("submit", async function(e){
    e.preventDefault();
    var input=f.querySelector("input"), v=input.value.trim().toLowerCase();
    if(!v || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){
      showErr("Please enter a valid email address."); input.focus(); return;
    }
    err.classList.remove("show");
    var btn=f.querySelector("button"); btn.disabled=true; btn.textContent="Joining…";
    try{
      var r=await fetch(SUPABASE_URL+"/rest/v1/waitlist",{
        method:"POST",
        headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",Prefer:"return=minimal"},
        body:JSON.stringify({email:v,source:"landing"})
      });
      if(r.status===201 || r.status===409){          // 409 = already on the list
        f.style.display="none"; done.classList.add("show");
      } else { throw new Error("status "+r.status); }
    }catch(_){
      btn.disabled=false; btn.textContent="Join the waitlist";
      showErr("Something went wrong. Please try again.");
    }
  });
</script>
</body>
</html>
